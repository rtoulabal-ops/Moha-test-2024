<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Moha</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;background:#fafafa;color:#1a1a1a;min-height:100vh;padding:1rem;font-size:15px;line-height:1.5;max-width:900px;margin:0 auto}
h1{font-size:1.3rem;text-align:center;margin-bottom:.2rem}
.sub{text-align:center;color:#777;font-size:.75rem;font-style:italic;margin-bottom:1rem}
.box{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:1rem;margin-bottom:.8rem}
.box.ok{border-color:#2d8a4e}
.lbl{display:block;font-size:.68rem;color:#777;margin-bottom:.4rem;text-transform:uppercase;font-weight:600}
input[type=password],input[type=text],textarea,select{width:100%;padding:.7rem;border:1px solid #e5e5e5;background:#fafafa;color:#1a1a1a;border-radius:8px;font-family:inherit;font-size:.88rem;margin-bottom:.4rem}
textarea{min-height:70px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:none;border-color:#7c3aed}
button{background:#1a1a1a;color:#fff;border:none;padding:.75rem;border-radius:8px;width:100%;font-size:.88rem;font-weight:600;cursor:pointer;font-family:inherit;margin-bottom:.5rem}
button.purple{background:#7c3aed}
button:disabled{opacity:.3}
.diag{background:#0a0a12;color:#a8d8b0;padding:.6rem;border-radius:6px;font-family:monospace;font-size:.7rem;line-height:1.5;min-height:30px;max-height:150px;overflow-y:auto;margin-bottom:.6rem;white-space:pre-wrap}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:.3rem;margin-bottom:.8rem;background:#fff;border-radius:12px;padding:.3rem;border:1px solid #e5e5e5}
.tab{padding:.6rem;border-radius:8px;text-align:center;cursor:pointer;font-weight:600;color:#777;font-size:.7rem}
.tab.active{background:#1a1a1a;color:#fff}
.panel{display:none}
.panel.active{display:block}
.scene{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:1rem;margin-bottom:.7rem}
.sc-head{display:flex;align-items:center;gap:.5rem;margin-bottom:.6rem}
.sc-num{background:#7c3aed;color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;flex-shrink:0}
.sc-title{font-size:.82rem;font-weight:600;flex:1}
.sc-status{font-size:.65rem;padding:.2rem .5rem;border-radius:10px;background:#f5f5f5;color:#777;text-transform:uppercase;font-weight:600}
.sc-status.done{background:#e3f5e9;color:#2d8a4e}
.sc-status.processing{background:#fff5e3;color:#d4a017}
.sc-status.failed{background:#fce3e3;color:#c0392b}
.sc-rm{width:26px;height:26px;border-radius:50%;border:1px solid #e5e5e5;background:#fff;cursor:pointer;color:#c0392b;font-size:.85rem}
.fld{margin-bottom:.5rem}
.fld label{display:block;font-size:.65rem;color:#777;margin-bottom:.25rem;text-transform:uppercase;font-weight:600}
.fld textarea{font-size:.82rem;min-height:55px}
.file-zone{position:relative;border:2px dashed #e5e5e5;border-radius:8px;padding:.9rem;text-align:center;cursor:pointer;margin-bottom:.5rem}
.file-zone input{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer}
.file-zone img,.file-zone video{width:100%;max-height:130px;object-fit:contain;border-radius:6px;display:block}
.file-zone .up-t{font-size:.75rem}
.f-rm{padding:.3rem .6rem;border:1px solid #e5e5e5;background:#fff;border-radius:6px;font-size:.65rem;color:#c0392b;cursor:pointer;margin-top:.3rem}
.sc-vid{margin-top:.5rem;border-radius:8px;overflow:hidden;background:#000}
.sc-vid video{width:100%;display:block}
.empty{text-align:center;padding:1.5rem;color:#999;font-size:.8rem}
.toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%) translateY(-100px);background:#1a1a1a;color:#fff;padding:.7rem 1.2rem;border-radius:8px;font-size:.8rem;z-index:1000;opacity:0;transition:all .3s;max-width:90vw;text-align:center}
.toast.visible{transform:translateX(-50%) translateY(0);opacity:1}
.toast.success{background:#2d8a4e}
.toast.error{background:#c0392b}
</style>
</head>
<body>

<h1>Studio Moha</h1>
<p class="sub">Magic Hour · Templates pro</p>

<div class="box ok" id="apiBox">
  <label class="lbl">Clé API Magic Hour</label>
  <input type="password" id="apiKeyInput" placeholder="mhk_live_...">
  <div style="display:flex; gap:0.5rem;">
    <button id="saveKeyBtn" style="flex:1;">Enregistrer la clé</button>
    <button id="testKeyBtn" style="flex:1; background:#7c3aed;">Tester la clé</button>
  </div>
  <div class="diag" id="apiDiag">Initialisation du script...</div>
</div>

<div class="tabs">
  <div class="tab active" data-tab="p1">📖 Histoire</div>
  <div class="tab" data-tab="p2">🎯 Templates</div>
  <div class="tab" data-tab="p3">🎬 Vidéos</div>
</div>

<div class="panel active" id="p1">
  <div class="box"><label class="lbl">Titre de l'histoire</label><input type="text" id="storyTitle" placeholder="Ex: Course poursuite à Paris"></div>
  <div class="box"><label class="lbl">Durée par vidéo</label><select id="storyDuration"><option value="5">5 secondes</option><option value="6" selected>6 secondes</option><option value="8">8 secondes</option><option value="10">10 secondes</option></select></div>
  <div class="diag" id="log">Prêt.</div>
  <div id="scenesList"></div>
  <button id="addSceneBtn">＋ Ajouter une scène</button>
  <button class="purple" id="generateBtn" disabled>🎬 Générer l'histoire</button>
  <button id="stopBtn" style="display:none;background:#fff;color:#c0392b;border:1px solid #c0392b">⏹ Arrêter</button>
</div>

<div class="panel" id="p2"><div class="box"><div class="empty">Templates (bientôt disponible)</div></div></div>
<div class="panel" id="p3"><div class="box"><label class="lbl">Vidéos générées</label><div class="gallery" id="gallery"><div class="empty">Aucune vidéo</div></div></div></div>
<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════════════════════════
// CONFIGURATION MAGIC HOUR
// ══════════════════════════════════════════════════════════════════
var API_KEY = localStorage.getItem('magic_hour_api_key') || '';
var API_BASE = 'https://api.magichour.ai/v1';
var scenes = [];
var isRunning = false;
var stopFlag = false;
var currentSceneNum = 0;
var totalScenes = 0;

function log(msg) {
  var el = document.getElementById('log');
  if(!el) return;
  var time = new Date().toLocaleTimeString('fr-FR');
  el.textContent += '\n[' + time + '] ' + msg;
  el.scrollTop = el.scrollHeight;
}

function toast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || 'success');
  t.classList.add('visible');
  setTimeout(function() { t.classList.remove('visible'); }, 3000);
}

function addScene() {
  scenes.push({ id: Date.now() + Math.random(), imageData: null, description: '', status: 'idle', videoUrl: null });
  renderScenes();
}

function removeScene(id) { scenes = scenes.filter(function(s) { return s.id !== id; }); renderScenes(); }

function updateField(id, field, value) {
  for (var i = 0; i < scenes.length; i++) { if (scenes[i].id === id) { scenes[i][field] = value; break; } }
}

function onImage(id, file) {
  if (!file) return;
  var r = new FileReader();
  r.onload = function(e) {
    for (var i = 0; i < scenes.length; i++) { if (scenes[i].id === id) { scenes[i].imageData = e.target.result; break; } }
    renderScenes();
  };
  r.readAsDataURL(file);
}

function renderScenes() {
  var list = document.getElementById('scenesList');
  if (scenes.length === 0) { list.innerHTML = '<div class="empty">Aucune scène. Cliquez sur Ajouter.</div>'; updateGenBtn(); return; }
  var html = '';
  for (var i = 0; i < scenes.length; i++) {
    var s = scenes[i];
    var cls = 'sc-status', txt = 'En attente';
    if (s.status === 'done') { cls += ' done'; txt = 'OK'; }
    else if (s.status === 'processing') { cls += ' processing'; txt = 'En cours'; }
    else if (s.status === 'failed') { cls += ' failed'; txt = 'Échec'; }
    html += '<div class="scene"><div class="sc-head"><div class="sc-num">' + (i+1) + '</div><div class="sc-title">Scène ' + (i+1) + '</div><div class="' + cls + '">' + txt + '</div>';
    if (scenes.length > 1) html += '<button class="sc-rm" data-rm="' + s.id + '">×</button>';
    html += '</div>';
    html += '<div class="fld"><label>Image de départ (optionnel)</label>';
    if (s.imageData) { html += '<div class="file-zone"><img src="' + s.imageData + '"><button class="f-rm" data-ci="' + s.id + '">Retirer</button></div>'; }
    else { html += '<label class="file-zone"><input type="file" accept="image/*" data-if="' + s.id + '"><div class="up-t">+ Ajouter une image</div></label>'; }
    html += '</div>';
    html += '<div class="fld"><label>Description</label><textarea data-f="description" data-s="' + s.id + '">' + (s.description || '') + '</textarea></div>';
    if (s.videoUrl) html += '<div class="sc-vid"><video src="' + s.videoUrl + '" controls></video></div>';
    html += '</div>';
  }
  list.innerHTML = html;
  list.querySelectorAll('[data-rm]').forEach(function(b) { b.onclick = function() { removeScene(parseFloat(this.getAttribute('data-rm'))); }; });
  list.querySelectorAll('[data-ci]').forEach(function(b) { b.onclick = function() { for (var i=0;i<scenes.length;i++) if(scenes[i].id===parseFloat(this.getAttribute('data-ci'))) scenes[i].imageData=null; renderScenes(); }; });
  list.querySelectorAll('input[data-if]').forEach(function(inp) { inp.onchange = function() { onImage(parseFloat(this.getAttribute('data-if')), this.files[0]); }; });
  list.querySelectorAll('textarea[data-f]').forEach(function(ta) { ta.oninput = function() { updateField(parseFloat(this.getAttribute('data-s')), this.getAttribute('data-f'), this.value); }; });
  updateGenBtn();
}

function updateGenBtn() {
  var btn = document.getElementById('generateBtn');
  btn.disabled = scenes.length === 0 || isRunning;
  btn.textContent = isRunning ? '⏳ Génération...' : (scenes.length === 0 ? 'Ajoutez une scène' : '🎬 Générer ' + scenes.length + ' vidéo' + (scenes.length > 1 ? 's' : ''));
}

function dataUriToBlob(dataUri) {
  var parts = dataUri.split(','); var mime = parts[0].match(/:(.*?);/)[1]; var bin = atob(parts[1]); var arr = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

function uploadFileToMagicHour(dataUri, ext, type) {
  return new Promise(function(resolve, reject) {
    fetch(API_BASE + '/files/upload-urls', { method: 'POST', headers: { 'Authorization': 'Bearer ' + API_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ items: [{ type: type, extension: ext }] }) })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var item = d.items && d.items[0];
      if (!item) throw new Error('Erreur upload');
      return fetch(item.upload_url, { method: 'PUT', headers: { 'Content-Type': 'application/octet-stream' }, body: dataUriToBlob(dataUri) })
      .then(function() { resolve(item.file_path); });
    }).catch(reject);
  });
}

function createVideoJob(scene, duration) {
  var prompt = scene.description || 'cinematic scene';
  var body;
  if (scene.imageData) {
    return uploadFileToMagicHour(scene.imageData, 'jpg', 'image').then(function(path) {
      body = { name: 'Scene', end_seconds: parseInt(duration), model: 'kling-3.0', resolution: '720p', aspect_ratio: '9:16', audio: true, style: { prompt: prompt }, assets: { image_file_path: path } };
      return fetch(API_BASE + '/image-to-video', { method: 'POST', headers: { 'Authorization': 'Bearer ' + API_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    }).then(function(r) { return r.json(); }).then(function(d) { return d.id || d.data.id; });
  }
  body = { name: 'Scene', end_seconds: parseInt(duration), model: 'kling-3.0', resolution: '720p', aspect_ratio: '9:16', audio: true, style: { prompt: prompt } };
  return fetch(API_BASE + '/text-to-video', { method: 'POST', headers: { 'Authorization': 'Bearer ' + API_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(function(r) { return r.json(); }).then(function(d) { return d.id || d.data.id; });
}

function pollVideoJob(jobId) {
  return new Promise(function(resolve, reject) {
    var attempts = 0;
    function check() {
      if (stopFlag) return reject(new Error('Arrêté'));
      if (attempts > 120) return reject(new Error('Timeout'));
      attempts++;
      fetch(API_BASE + '/video-projects/' + jobId, { headers: { 'Authorization': 'Bearer ' + API_KEY } })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.status === 'complete' || d.status === 'completed' || d.status === 'succeeded') { resolve((d.download && d.download.url) || (d.output && d.output.url) || d.url); }
        else if (d.status === 'error' || d.status === 'failed') { reject(new Error('Échec génération')); }
        else { setTimeout(check, 5000); }
      }).catch(function() { setTimeout(check, 5000); });
    }
    check();
  });
}

async function start() {
  if (isRunning || scenes.length === 0) return;
  if (!API_KEY) { toast('Entrez une clé API', 'error'); return; }
  isRunning = true; stopFlag = false; updateGenBtn();
  var duration = document.getElementById('storyDuration').value;
  totalScenes = scenes.length;
  log('=== Début de la génération ===');
  for (var i = 0; i < scenes.length; i++) {
    if (stopFlag) break;
    scenes[i].status = 'processing'; currentSceneNum = i+1; renderScenes();
    try {
      log('Traitement scène ' + (i+1) + '...');
      var jobId = await createVideoJob(scenes[i], duration);
      var url = await pollVideoJob(jobId);
      scenes[i].status = 'done'; scenes[i].videoUrl = url; renderScenes(); renderGallery();
      log('✓ Scène ' + (i+1) + ' prête !');
    } catch(e) { scenes[i].status = 'failed'; renderScenes(); log('✗ Échec scène ' + (i+1) + ' : ' + e.message); }
  }
  isRunning = false; updateGenBtn(); log('=== FIN ==='); toast('Génération terminée !');
}

function renderGallery() {
  var g = document.getElementById('gallery'); var html = '';
  for (var i = 0; i < scenes.length; i++) {
    if (scenes[i].videoUrl) { html += '<div style="margin-bottom:10px"><video src="' + scenes[i].videoUrl + '" controls style="width:100%"></video></div>'; }
  }
  g.innerHTML = html || '<div class="empty">Aucune vidéo</div>';
}

// INITIALISATION
document.getElementById('apiDiag').textContent = '✅ Script Magic Hour chargé !';
if (API_KEY) { document.getElementById('apiKeyInput').value = API_KEY; document.getElementById('apiDiag').textContent = '✅ Clé Magic Hour chargée (' + API_KEY.length + ' car.)'; }
else { document.getElementById('apiDiag').textContent = '⚠️ Aucune clé API Magic Hour.'; }

document.getElementById('saveKeyBtn').onclick = function() {
  var k = document.getElementById('apiKeyInput').value.trim();
  if (!k) return alert('Entrez une clé');
  localStorage.setItem('magic_hour_api_key', k); API_KEY = k;
  document.getElementById('apiDiag').textContent = '✅ Clé Magic Hour enregistrée !'; toast('Clé enregistrée !');
};

document.getElementById('testKeyBtn').onclick = function() {
  var k = document.getElementById('apiKeyInput').value.trim();
  if (!k) return alert('Entrez une clé');
  document.getElementById('apiDiag').textContent = 'Test...';
  fetch(API_BASE + '/files/upload-urls', { method: 'POST', headers: { 'Authorization': 'Bearer ' + k, 'Content-Type': 'application/json' }, body: JSON.stringify({ items: [{ type: 'image', extension: 'jpg' }] }) })
  .then(r => { document.getElementById('apiDiag').textContent = r.ok ? '✅ Clé Magic Hour valide !' : '❌ Clé invalide (' + r.status + ')'; });
};

document.getElementById('addSceneBtn').onclick = addScene;
document.getElementById('generateBtn').onclick = start;
document.getElementById('stopBtn').onclick = function() { stopFlag = true; log('Arrêt demandé...'); };
document.querySelectorAll('.tab').forEach(function(t) { t.onclick = function() { document.querySelectorAll('.tab').forEach(function(x) { x.classList.remove('active'); }); this.classList.add('active'); document.querySelectorAll('.panel').forEach(function(x) { x.classList.remove('active'); }); document.getElementById(this.getAttribute('data-tab')).classList.add('active'); }; });
addScene(); log('Studio Moha prêt — Magic Hour');
</script>
</body>
  </html>
